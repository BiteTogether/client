# Required metadata
sonar.projectKey=BiteTogether_client
sonar.projectName=BiteTogether Client
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=src/__tests__

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts

# TypeScript/JavaScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/node_modules/**,\
  **/android/**,\
  **/ios/**,\
  **/coverage/**,\
  **/*.d.ts

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/android/**,\
  **/ios/**,\
  **/coverage/**,\
  **/__mocks__/**,\
  **/assets/**,\
  **/*.config.js,\
  **/*.config.cjs,\
  **/babel.config.cjs,\
  **/metro.config.js

# Test file patterns
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/__tests__/**/*.ts,\
  **/__tests__/**/*.tsx

# Duplications exclusions
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/__tests__/**

# Quality Gate
sonar.qualitygate.wait=true
